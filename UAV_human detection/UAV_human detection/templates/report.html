<!DOCTYPE html>
<html>
<head>
    <title>UAV Detection Report</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body{
            font-family:Arial;
            background:#f5f5f5;
            text-align:center;
            padding:20px;
        }

        .cards{
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:20px;
            margin:30px;
        }

        .card{
            background:white;
            width:220px;
            padding:20px;
            border-radius:12px;
            box-shadow:0 0 12px rgba(0,0,0,0.15);
        }

        .card h2{
            color:#ff5722;
        }

        .chart-box{
            width:80%;
            max-width:900px;
            margin:30px auto;
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 0 12px rgba(0,0,0,0.15);
        }

        .download{
            display:inline-block;
            margin-top:25px;
            background:green;
            color:white;
            padding:12px 25px;
            text-decoration:none;
            border-radius:8px;
        }
    </style>
</head>

<body>

<h1>📊 UAV Human Detection Report</h1>

<!-- CARDS -->
<div class="cards">

    <div class="card">
        <h2>{{total_alerts}}</h2>
        <p>Total Alerts</p>
    </div>

    <div class="card">
        <h2>{{total_humans}}</h2>
        <p>Total Humans</p>
    </div>

    <div class="card">
        <h2>{{low_count}}</h2>
        <p>LOW Alerts</p>
    </div>

    <div class="card">
        <h2>{{medium_count}}</h2>
        <p>MEDIUM Alerts</p>
    </div>

    <div class="card">
        <h2>{{high_count}}</h2>
        <p>HIGH Alerts</p>
    </div>

</div>

<!-- LINE CHART -->
<div class="chart-box">
    <h2>📈 Human Detection Trend</h2>
    <canvas id="lineChart"></canvas>
</div>

<!-- PIE CHART -->
<div class="chart-box">
    <h2>Alert Severity Distribution</h2>

    <div style="width:500px; height:500px; margin:auto;">
        <canvas id="pieChart"></canvas>
    </div>
</div>

<!-- BAR CHART -->
<div class="chart-box">
    <h2>Alert Statistics</h2>
    <canvas id="barChart"></canvas>
</div>

<!-- DOWNLOAD -->
<a href="/download_report" class="download">
📥 Download Excel Report
</a>

<!-- JS -->
<script>

let rows = {{ rows_json | safe }};
console.log(rows);
/* ---------------- LINE CHART ---------------- */
let labels = rows.map(r => r[1]);
let humans = rows.map(r => Number(r[2]));

new Chart(document.getElementById("lineChart"), {
    type: 'line',
    data: {
        labels: labels,
        datasets: [{
            label: 'Human Count',
            data: humans,
            borderColor: 'blue',
            tension: 0.4,
            fill: false
        }]
    }
});

/* ---------------- PIE CHART ---------------- */
new Chart(document.getElementById("pieChart"), {
    type: 'pie',
    data: {
        labels: ['Alerts', 'Humans'],
        datasets: [{
            data: [{{ total_alerts }}, {{ total_humans }}]
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false
    }
});

/* ---------------- BAR CHART ---------------- */
new Chart(document.getElementById("barChart"), {
    type: 'bar',
    data: {
        labels: ['Alerts', 'Humans'],
        datasets: [{
            label: 'Count',
            data: [{{ total_alerts }}, {{ total_humans }}]
        }]
    }
});

</script>

</body>
</html>
